name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper:
    name: Build paper
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tectonic
        uses: wtfjoke/setup-tectonic@v3
        with:
          tectonic-version: latest
      - name: Compile
        working-directory: paper
        run: |
          mkdir -p build
          tectonic -X compile main.tex --outdir build --keep-logs --keep-intermediates
      - name: Fail on undefined citations
        working-directory: paper
        run: |
          if grep -q "Citation .* undefined" build/main.log; then
            echo "::error::undefined citations present"
            grep "Citation .* undefined" build/main.log
            exit 1
          fi
          echo "all citations resolved"
      - name: Assemble arXiv package
        working-directory: paper
        run: |
          mkdir -p ../dist
          cp main.tex refs.bib build/main.bbl ../dist/
          tar czf arxiv-submission.tar.gz -C ../dist main.tex refs.bib main.bbl
      - uses: actions/upload-artifact@v4
        with:
          name: paper
          path: |
            paper/build/main.pdf
            paper/arxiv-submission.tar.gz

  schema:
    name: Validate evidence records
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Schema parses
        run: python3 -c "import json;json.load(open('schema/evidence.schema.json'));print('schema ok')"
      - name: Records validate
        run: python3 tools/validate_evidence.py schema/example-record.json schema/example-advisory-record.json
      - name: Gating invariant is enforced
        run: |
          python3 - <<'PY'
          import json
          r = json.load(open('schema/example-advisory-record.json'))
          r['fidelity']['gating_authority'] = 'gating'   # rho 0.52 < tau: must be rejected
          json.dump(r, open('/tmp/bad.json', 'w'))
          PY
          if python3 tools/validate_evidence.py /tmp/bad.json; then
            echo "::error::validator accepted a record claiming unearned gating authority"
            exit 1
          fi
          echo "invariant enforced"
